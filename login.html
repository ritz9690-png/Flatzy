<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.jpeg">
<title>Login – Flatzy Nagpur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:        #3b82f6;
  --accent2:       #60a5fa;
  --accent-dim:    rgba(59,130,246,0.15);
  --border-subtle: rgba(59,130,246,0.2);
  --border-active: rgba(59,130,246,0.65);
  --text:   #f0f6ff;
  --muted:  rgba(200,220,255,0.55);
  --card-bg: rgba(2, 10, 28, 0.52);
}

body {
  background: #020d1f;
  min-height: 100vh;
  display: flex; flex-direction: column;
  position: relative; overflow-x: hidden;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
}

/* ── VIDEO BACKGROUND ── */
#bg-video {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
}

/* ── NAVBAR ── */
nav.topnav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 62px;
  background: #ffffff !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 2px solid #3b82f6 !important;
  box-shadow: 0 2px 16px rgba(59,130,246,0.10) !important;
  z-index: 1001;
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease;
}
nav.topnav::after { display: none !important; } /* remove shimmer from style.css */
nav.topnav.nav-hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
nav.topnav .logo {
  display:flex; align-items:center; gap:0.6rem; text-decoration:none;
  font-family:'Syne',sans-serif; font-size:1.35rem; font-weight:800;
  color:#1a1a2e !important; letter-spacing:-0.5px; filter: none !important;
}
nav.topnav .logo img { height:36px; width:auto; border-radius:8px; }
nav.topnav .logo .logo-accent { color: #3b82f6 !important; }
nav.topnav .nav-links { display:flex; gap:0.5rem; }
nav.topnav .nav-links a {
  color:#374151 !important; text-decoration:none; font-size:0.875rem;
  font-weight:500; padding:0.4rem 0.85rem; border-radius:8px;
  transition:color 0.2s, background 0.2s;
}
nav.topnav .nav-links a::after { display: none !important; }
nav.topnav .nav-links a:hover { color:#3b82f6 !important; background:rgba(59,130,246,0.08) !important; }
nav.topnav .nav-btn {
  font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:600;
  padding:0.45rem 1rem; border-radius:9px; text-decoration:none; transition:all 0.2s;
  background: transparent !important; box-shadow: none !important;
}
nav.topnav .nav-btn.outline {
  color:#374151 !important; border:1.5px solid #3b82f6 !important; background:transparent !important;
}
nav.topnav .nav-btn.outline:hover { color:#3b82f6 !important; background:rgba(59,130,246,0.08) !important; border-color:#2563eb !important; }

/* ── MAIN WRAP ── */
.login-wrap {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:70px 1rem 1rem;
  position: relative; z-index: 10;
}

/* Laptop: card to right side */
@media(min-width:769px) {
  .login-wrap {
    justify-content: flex-end;
    padding-right: 6vw;
  }
}

/* ── CARD ── */
.login-card {
  width:100%; max-width:360px;
  position:relative; overflow:hidden;
  background: linear-gradient(160deg, rgba(220,235,255,0.85) 0%, rgba(200,222,255,0.80) 100%);
  backdrop-filter: blur(60px) saturate(1.8);
  -webkit-backdrop-filter: blur(60px) saturate(1.8);
  border: 1.5px solid rgba(59,130,246,0.2);
  border-radius: 28px;
  padding: 1.8rem 1.8rem 1.6rem;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.9) inset,
    0 2px 0 rgba(255,255,255,0.8) inset,
    0 24px 60px rgba(59,130,246,0.12),
    0 8px 32px rgba(0,0,0,0.12);
  animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(24px) scale(0.97); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}
/* top blue glow arc */
.login-card::before {
  content:'';
  position:absolute; top:-40px; left:50%; transform:translateX(-50%);
  width:300px; height:100px;
  background: radial-gradient(ellipse, rgba(59,130,246,0.10) 0%, transparent 70%);
  pointer-events:none;
}

/* ── BRAND ── */
.login-brand { text-align:center; margin-bottom:0.2rem; position:relative; }

.login-logo-img {
  width:50px; height:50px; border-radius:14px; object-fit:cover;
  box-shadow:
    0 0 0 1px rgba(99,160,255,0.3),
    0 0 0 4px rgba(59,130,246,0.10),
    0 8px 28px rgba(0,0,0,0.65);
  margin-bottom:0.7rem;
  animation: logoPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.15s both;
}
@keyframes logoPop {
  from { opacity:0; transform:scale(0.7); }
  to   { opacity:1; transform:scale(1); }
}

.login-wordmark {
  font-family:'Syne',sans-serif; font-size:2rem; font-weight:800;
  letter-spacing:-2px; line-height:1; color:#0f172a;
  text-shadow: none;
}
.login-wordmark span {
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-tagline {
  font-size:0.72rem; font-weight:600; color:#64748b;
  letter-spacing:0.18em; text-transform:uppercase; margin-top:0.5rem;
}

.card-divider {
  width:100%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,0.2),transparent);
  margin:1.1rem 0;
}

.role-label {
  font-size:0.68rem; font-weight:700; letter-spacing:0.14em;
  text-transform:uppercase; color:#94a3b8; margin-bottom:0.8rem;
}

/* ── ROLE CARDS ── */
.role-row { display:flex; gap:0.8rem; margin-bottom:1.1rem; }

.role-opt {
  flex:1; position:relative; overflow:hidden;
  background: rgba(255,255,255,0.75);
  border: 1.5px solid rgba(59,130,246,0.15);
  border-radius:20px; padding:0.9rem 0.6rem 0.85rem;
  text-align:center; cursor:pointer;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 2px 8px rgba(59,130,246,0.06);
}
.role-opt::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(145deg, rgba(255,255,255,0.6) 0%, transparent 60%);
  border-radius:20px; pointer-events:none;
}
.role-opt:hover {
  border-color:rgba(59,130,246,0.4);
  background: rgba(239,246,255,0.95);
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(59,130,246,0.14);
}
.role-opt.selected {
  border-color: #3b82f6;
  background: linear-gradient(145deg, rgba(219,234,254,0.95), rgba(239,246,255,1));
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12), 0 8px 24px rgba(59,130,246,0.18);
  transform: translateY(-1px);
}
.role-opt.selected::after {
  content:'✓'; position:absolute; top:10px; right:12px;
  font-size:0.65rem; font-weight:900; color:#fff;
  background: linear-gradient(135deg,#3b82f6,#1d4ed8);
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 8px rgba(59,130,246,0.4);
}
.role-icon {
  font-size:1.7rem; margin-bottom:0.3rem; display:block;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12));
}
.role-name {
  font-family:'Syne',sans-serif; font-size:0.8rem; font-weight:800;
  color:#1e3a5f; letter-spacing:0.05em; line-height:1.3;
}
.role-desc { font-size:0.68rem; color:#64748b; margin-top:0.3rem; }

/* ── INFO NOTE ── */
.info-note {
  display:flex; align-items:center; gap:0.7rem;
  background: linear-gradient(135deg, rgba(219,234,254,0.5), rgba(239,246,255,0.4));
  border: 1px solid rgba(59,130,246,0.2);
  border-radius:14px; padding:0.85rem 1rem;
  font-size:0.78rem; color:#1e40af;
  margin-bottom:0.7rem; line-height:1.5;
}
.info-note-icon { font-size:1rem; flex-shrink:0; }

/* ── GOOGLE BTN ── */
.google-btn {
  display:flex; align-items:center; justify-content:center; gap:0.8rem;
  width:100%; padding:1rem 1.25rem;
  background: linear-gradient(180deg, #ffffff 0%, #f1f5ff 100%);
  border:none; border-radius:16px;
  font-family:'DM Sans',sans-serif; font-size:0.97rem;
  font-weight:700; color:#111827; cursor:pointer;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 6px 24px rgba(0,0,0,0.5),
    0 0 0 1px rgba(0,0,0,0.08);
  transition:all 0.25s cubic-bezier(0.16,1,0.3,1);
  position:relative; overflow:hidden;
}
.google-btn::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, transparent 50%);
  border-radius:16px; pointer-events:none;
}
.google-btn:hover {
  transform:translateY(-3px);
  box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 16px 40px rgba(0,0,0,0.6), 0 0 40px rgba(59,130,246,0.25);
}
.google-btn:active { transform:translateY(0); }
.google-btn:disabled { opacity:0.5; pointer-events:none; }
.google-logo { width:22px; height:22px; flex-shrink:0; position:relative; z-index:1; }

.btn-spinner {
  width:20px; height:20px;
  border:2.5px solid rgba(59,130,246,0.2); border-top-color:#3b82f6;
  border-radius:50%; flex-shrink:0; animation:spin 0.7s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── FOOTER ── */
.login-footer {
  text-align:center; margin-top:1.3rem;
  font-size:0.71rem; color:#94a3b8; line-height:1.7;
}
.login-footer a { color:#3b82f6; text-decoration:none; transition:color 0.2s; }
.login-footer a:hover { color:#1d4ed8; text-decoration:underline; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:2rem; left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(4,12,32,0.96); backdrop-filter:blur(24px);
  border:1px solid rgba(99,160,255,0.2); border-radius:16px;
  padding:0.8rem 1.5rem; font-size:0.875rem; font-weight:500;
  color:#e8f0ff; opacity:0; pointer-events:none;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 12px 40px rgba(0,0,0,0.7);
  max-width:320px; text-align:center; z-index:999;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
.toast.error { border-color:rgba(239,68,68,0.4); }

@media(max-width:480px) {
  .topnav { padding:0 1rem; }
  .nav-links { display:none; }
  .login-card { border-radius:26px; padding:2rem 1.5rem 1.8rem; max-width:100%; }
  .login-wordmark { font-size:2rem; }
  .role-row { gap:0.6rem; }
  .login-wrap { padding:80px 1rem 1.5rem; justify-content:center; }
}
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="home.mp4" type="video/mp4">
</video>

<nav class="topnav">
  <a href="index.html" class="logo">
    <img src="favicon.jpeg" alt="Flatzy">
    Flat<span class="logo-accent">zy</span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="rent.html">Browse</a>
  </div>
  <a href="index.html" class="nav-btn outline">← Back</a>
</nav>

<div class="login-wrap">
  <div class="login-card" id="loginCard">

    <div class="login-brand">
      <img src="favicon.jpeg" alt="Flatzy" class="login-logo-img">
      <div class="login-wordmark">Flat<span>zy</span></div>
      <div class="login-tagline">Nagpur's Trusted Rental Platform</div>
    </div>

    <div class="card-divider"></div>

    <div class="role-label">I am looking to…</div>
    <div class="role-row">
      <div class="role-opt selected" id="role-tenant" onclick="selectRole('tenant')">
        <span class="role-icon">🏠</span>
        <div class="role-name">FIND A FLAT</div>
        <div class="role-desc">Browse &amp; book rentals</div>
      </div>
      <div class="role-opt" id="role-owner" onclick="selectRole('owner')">
        <span class="role-icon">🔑</span>
        <div class="role-name">LIST PROPERTY</div>
        <div class="role-desc">via WhatsApp 💬</div>
      </div>
    </div>

    <div class="info-note">
      <span class="info-note-icon">🔒</span>
      Secure login with Google — no password needed.
    </div>

    <div class="google-btn-wrap">
      <button class="google-btn" id="googleBtn" onclick="googleLogin()">
        <svg class="google-logo" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <p class="login-footer">
      By continuing, you agree to Flatzy's
      <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>
    </p>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedRole = 'tenant';

function selectRole(role) {
  if (role === 'owner') {
    const msg = encodeURIComponent("Hi! I want to list my property on Flatzy Nagpur. Please help me.");
    window.open("https://wa.me/917385866455?text=" + msg, '_blank');
    return;
  }
  selectedRole = role;
  document.getElementById('role-tenant').classList.toggle('selected', role === 'tenant');
  document.getElementById('role-owner').classList.toggle('selected', role === 'owner');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInWithRedirect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1ChJCaBHpAPnvdK7Z7dbST7bTViuBrWg",
  authDomain: "flatzyhomes.firebaseapp.com",
  projectId: "flatzyhomes",
  storageBucket: "flatzyhomes.firebasestorage.app",
  messagingSenderId: "519957313457",
  appId: "1:519957313457:web:1ffc1685819120edd7ef90"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, user => {
  if (user) {
    const saved = JSON.parse(localStorage.getItem('flatzy_user') || '{}');
    const role = saved.role || 'tenant';
    const onboarded = localStorage.getItem('flatzy_onboarded');
    if (role === 'owner') { window.location = 'owner.html'; }
    else if (onboarded)  { window.location = 'index.html'; }
  }
});

window.googleLogin = async function() {
  const btn = document.getElementById('googleBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span> Signing in…';

  try {
    const result = await signInWithPopup(auth, provider);
    const user   = result.user;
    const userRef  = doc(db, 'users', user.uid);
    const existing = await getDoc(userRef);
    const role = existing.exists() ? (existing.data().role || window._selectedRole || 'tenant') : (window._selectedRole || 'tenant');

    await setDoc(userRef, {
      name: user.displayName, email: user.email,
      uid: user.uid, photo: user.photoURL,
      role, lastLogin: new Date().toISOString()
    }, { merge: true });

    showToast('Welcome, ' + user.displayName.split(' ')[0] + '! ✅');

    localStorage.setItem('flatzy_user', JSON.stringify({
      name: user.displayName, email: user.email,
      uid: user.uid, photo: user.photoURL, role
    }));

    const _urlParams = new URLSearchParams(window.location.search);
    const _urlRef = _urlParams.get('ref') || _urlParams.get('code') || '';
    if (_urlRef) localStorage.setItem('flatzy_pending_ref', _urlRef.toUpperCase().trim());

    setTimeout(() => {
      window.location = role === 'owner' ? 'owner.html' : 'onboard.html';
    }, 1200);

  } catch(e) {
    let msg = 'Google login failed ❌';
    if (e.code === 'auth/popup-closed-by-user') msg = 'Login cancelled';
    else if (e.code === 'auth/network-request-failed') msg = 'Network error. Check connection.';
    else if (e.code === 'auth/popup-blocked') { signInWithRedirect(auth, provider); return; }
    showToast(msg, 'error');
    btn.disabled = false;
    btn.innerHTML = '<svg class="google-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google';
  }
};

Object.defineProperty(window, '_selectedRole', {
  get() { return typeof selectedRole !== 'undefined' ? selectedRole : 'tenant'; }
});
</script>

<script>
const bgVideo = document.getElementById('bg-video');
if (bgVideo) {
  bgVideo.playbackRate = 1.0;
  bgVideo.play().catch(() => {
    const r = () => { bgVideo.play(); bgVideo.playbackRate = 1.0; };
    document.addEventListener('touchstart', r, { once: true });
    document.addEventListener('click', r, { once: true });
  });
}
</script>

<script>
// ── NAVBAR AUTO-HIDE ──
const navbar = document.querySelector('.topnav');
let hideTimer = null;

function showNav() {
  navbar.classList.remove('nav-hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    navbar.classList.add('nav-hidden');
  }, 2000);
}

// start hidden after first 2s
showNav();

// mouse: show when near top
document.addEventListener('mousemove', (e) => {
  if (e.clientY < 80) {
    showNav();
  }
});

// touch: show when swipe/touch near top
document.addEventListener('touchstart', (e) => {
  if (e.touches[0].clientY < 80) {
    showNav();
  }
});
document.addEventListener('touchmove', (e) => {
  if (e.touches[0].clientY < 80) {
    showNav();
  }
});
</script>

<script type="module" src="user-tracker.js"></script>
</body>
</html>
